server {
  listen 80;
  server_name _;
  location = /api/salud { proxy_pass http://nomina2-api:3000/api/salud; }
  location = /salud { root /usr/share/nginx/html; try_files /index.html =404; }
  location = / { return 308 https://$host:${WEB_HTTPS_PORT}$request_uri; }
  location / { return 308 https://$host:${WEB_HTTPS_PORT}$request_uri; }
}

server {
  listen 443 ssl;
  ssl_certificate /etc/nginx/tls/localhost.crt;
  ssl_certificate_key /etc/nginx/tls/localhost.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy same-origin always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

  location /api/ {
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api nomina2-api:3000;
    proxy_pass http://$api$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  # Los workers de PDF.js son módulos ES; nosniff exige un MIME JavaScript.
  location ~ \.mjs$ {
    types { application/javascript mjs; }
    try_files $uri =404;
  }
}
